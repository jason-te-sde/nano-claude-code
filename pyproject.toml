[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nano-claude-code"
version = "0.1.0.dev0"
description = "A terminal coding agent that works with Anthropic, OpenAI-compatible and local models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13.7", "prompt_toolkit>=3.0.47", "pathspec>=0.12"]

[project.optional-dependencies]
shell = ["tree-sitter>=0.22", "tree-sitter-bash>=0.21"]
openai = ["tiktoken>=0.7"]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
  "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5",
]

[project.scripts]
ncc = "nanoclaude.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "PTH",
          "RET", "ARG", "C4", "ISC", "PIE", "TID"]
ignore = ["ANN401", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN001", "ANN201", "ARG001"]
"src/nanoclaude/tools/proc.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
