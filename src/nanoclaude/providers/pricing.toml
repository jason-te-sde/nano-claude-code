# Verified 2026-10-07 against https://platform.claude.com/docs/en/about-claude/pricing
# (first-party Claude API rates; cache_write is the 5-minute write).
#
# A model priced by prompt length has threshold_tokens and an above_threshold table: a call
# whose prompt (input + cache read + cache write tokens) is longer than that is charged the
# second set for every token it uses. Up to and including the threshold is the first set.
